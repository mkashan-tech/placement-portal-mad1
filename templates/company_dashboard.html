<h2>Company Dashboard</h2>

<a href="/company/job/create">Create Job</a>

<table border="1">
<tr>

    <th>Title</th>
    <th>Status</th>
    <th>Approved</th>
    <th>Action</th>

</tr>

{% for job in jobs %}
<tr>
    <td>{{ job.title }}</td>
    <td>{{ job.status }}</td>
    <td>{{ job.approved }}</td>
    <td>
        <a href="/company/job/{{ job.id }}/applications">Applications</a>
    </td>
</tr>
{% endfor %}
</table>

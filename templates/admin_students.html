{% extends "base.html" %}

{% block content %}
<h2>Students</h2>

<table class="table table-striped table-bordered">
<thead class="table-dark">
<tr>
    <th>Name</th>
    <th>Email</th>
    <th>Status</th>
    <th>Action</th>
</tr>
</thead>

<tbody>
{% for s in students %}
<tr>
    <td>{{ s.name }}</td>
    <td>{{ s.email }}</td>
    <td>
        {% if s.is_active %}
            <span class="badge bg-success">Active</span>
        {% else %}
            <span class="badge bg-danger">Inactive</span>
        {% endif %}
    </td>
    <td>
        <a class="btn btn-sm btn-danger" href="/admin/student/{{ s.id }}/deactivate">
            Deactivate
        </a>
    </td>
</tr>
{% endfor %}
</tbody>
</table>
{% endblock %}

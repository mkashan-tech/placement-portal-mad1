{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Create New Placement Drive</h2>

    <form method="POST" class="col-md-8 card p-4 shadow-sm">
        <div class="row">
            <div class="col-md-12 mb-3">
                <label class="form-label">Job Title</label>
                <input class="form-control" name="title" required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Salary (LPA)</label>
                <input class="form-control" type="number" name="salary" required placeholder="e.g. 600000">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">CGPA Cutoff</label>
                <input class="form-control" type="number" step="0.01" name="cgpa_cutoff" required placeholder="0.00">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Location</label>
                <input class="form-control" name="location" required>
            </div>

            <div class="col-md-6 mb-4">
                <label class="form-label">Application Deadline</label>
                <input class="form-control" type="date" name="deadline" required>
            </div>
            
            <div class="col-md-12 mb-3">
                <label class="form-label">Skills Required</label>
                <input class="form-control" name="skills" placeholder="e.g. Python, Flask">
            </div>

            <div class="col-md-12 mb-3">
                <label class="form-label">Job Description</label>
                <textarea class="form-control" name="description" rows="4" required></textarea>
            </div>
        </div>

        <button class="btn btn-success py-2 px-4">Create Job / Drive</button>
    </form>
</div>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<h2>Student Dashboard</h2>

<h4>Available Jobs</h4>
<table class="table table-bordered">
<tr>
    <th>Title</th>
    <th>Company</th>
    <th>Action</th>
</tr>

{% for job in jobs %}
<tr>
    <td>{{ job.title }}</td>
    <td>{{ job.company.name }}</td>
    <td>
        <a class="btn btn-primary btn-sm" href="/student/apply/{{ job.id }}">Apply</a>
    </td>
</tr>
{% endfor %}
</table>

<h4>My Applications</h4>
<table class="table table-bordered">
<tr>
    <th>Job</th>
    <th>Status</th>
</tr>

{% for a in applications %}
<tr>
    <td>{{ a.job }}</td>
    <td>{{ a.status }}</td>
</tr>
{% endfor %}
</table>
{% endblock %}

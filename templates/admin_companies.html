<h2>Companies</h2>

<table border="1">

<tr>
    <th>Name</th>
    <th>Email</th>
    <th>Approved</th>
    <th>Active</th>
    <th>Action</th>
</tr>

{% for c in companies %}
<tr>
    <td>{{ c.name }}</td>
    <td>{{ c.email }}</td>
    <td>{{ c.approved }}</td>
    <td>{{ c.is_active }}</td>
    <td>
        <a href="/admin/company/{{ c.id }}/approve">Approve</a>
        <a href="/admin/company/{{ c.id }}/deactivate">Deactivate</a>
    </td>
</tr>
{% endfor %}
</table>
